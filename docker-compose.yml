services:
  postgres:
    image: postgres:16-alpine
    container_name: student_ai_postgres
    environment:
      POSTGRES_USER: student_ai
      POSTGRES_PASSWORD: student_ai_pass
      POSTGRES_DB: student_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: student_ai_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
volumes:
  postgres_data: